spring.application.name=nose
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://localhost:3306/base_ferreteria
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql: true

# --- Seguridad JWT ---
# La clave se toma de la variable de entorno JWT_SECRET; si no existe se usa la de desarrollo.
# Debe tener al menos 32 caracteres (HS256).
app.jwt.secret=${JWT_SECRET:clave-secreta-de-desarrollo-ferreteria-los-maestros-2026}
# Duración del access token: 15 minutos (en milisegundos)
app.jwt.access-expiration-ms=900000
# Duración del refresh token: 7 días (en milisegundos)
app.jwt.refresh-expiration-ms=604800000

# --- CORS: orígenes del frontend autorizados (separados por coma) ---
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
